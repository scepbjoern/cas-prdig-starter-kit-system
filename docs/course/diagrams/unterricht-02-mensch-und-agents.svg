<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Mensch und Agents im Feature-PIV"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466774"/></marker></defs><rect width="1280" height="720" fill="white"/><g font-family="Arial,sans-serif" fill="#173c49"><text x="40" y="56" font-size="34" font-weight="700">Mensch und Agents im Feature-PIV</text><text x="40" y="94" font-size="21">Planung und Implementierung sind getrennt. Implementierer B validiert selbst.</text><rect x="40" y="145" width="340" height="138" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text x="60" y="175" font-size="16" font-weight="700">MENSCH + PLANER A</text><text x="60" y="215" font-size="24" font-weight="400">Ziel, Kriterien, Szenarien</text><text x="60" y="251" font-size="24" font-weight="400">und Testdaten klären</text><rect x="470" y="145" width="340" height="138" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="490" y="175" font-size="16" font-weight="700">PLANER A</text><text x="490" y="215" font-size="24" font-weight="400">Feature Plan erstellen</text><text x="490" y="251" font-size="24" font-weight="400">und dauerhaft speichern</text><rect x="900" y="145" width="340" height="138" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="920" y="175" font-size="16" font-weight="700">NEUER KONTEXT B</text><text x="920" y="215" font-size="24" font-weight="400">Plan selbst einlesen</text><text x="920" y="251" font-size="24" font-weight="400">und implementieren</text><path d="M380 213h85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><path d="M810 213h85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><rect x="900" y="365" width="340" height="138" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="920" y="395" font-size="16" font-weight="700">DERSELBE AGENT B</text><text x="920" y="435" font-size="24" font-weight="400">Vereinbarte Checks</text><text x="920" y="471" font-size="24" font-weight="400">ausführen und korrigieren</text><path d="M1070 283v76" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><path d="M1240 430h22V213h-17" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="365" width="340" height="138" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text x="490" y="395" font-size="16" font-weight="700">VERANTWORTLICHE PERSON</text><text x="490" y="435" font-size="24" font-weight="400">Ergebnis ausprobieren</text><text x="490" y="471" font-size="24" font-weight="400">und fachlich abnehmen</text><path d="M900 430h-85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><text x="810" y="342" font-size="16" font-weight="400">Belegt bereit</text><rect x="40" y="365" width="340" height="138" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="60" y="395" font-size="16" font-weight="700">KOORDINATIONSAGENT</text><text x="60" y="435" font-size="24" font-weight="400">Zusammenführen</text><text x="60" y="471" font-size="24" font-weight="400">und passend nachtesten</text><path d="M470 430h-85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><text x="405" y="342" font-size="16" font-weight="400">Angenommen</text><text x="40" y="544" font-size="19">Nacharbeit führt zurück zu B; verändertes Verhalten nach Integration erneut abnehmen.</text><rect x="40" y="570" width="1200" height="100" rx="12" fill="#e5f4ec"/><text x="64" y="609" font-size="23" font-weight="400">PRD und Architekturen: unabhängiger Review in frischem Kontext.</text><text x="64" y="644" font-size="23" font-weight="400">Feature: kein Pflichtreview jedes Plans und kein separater Validator C.</text></g></svg>