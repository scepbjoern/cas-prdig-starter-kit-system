<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Visuell erkunden und Anforderungen verbessern"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466774"/></marker></defs><rect width="1280" height="720" fill="white"/><g font-family="Arial,sans-serif" fill="#173c49"><text x="40" y="56" font-size="34" font-weight="700">Visuell erkunden und Anforderungen verbessern</text><text x="40" y="94" font-size="21">Ein schneller Entwurf schafft Gesprächsstoff für die spätere systematische Umsetzung</text><rect x="40" y="145" width="340" height="132" rx="12" fill="#e5f4ec" stroke="#92aeb4"/><text x="60" y="175" font-size="16" font-weight="700">AUSGANGSPUNKT</text><text x="60" y="215" font-size="24" font-weight="400">Erste Ausbaustufe</text><text x="60" y="251" font-size="24" font-weight="400">im PRD konkretisieren</text><rect x="470" y="145" width="340" height="132" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="490" y="175" font-size="16" font-weight="700">AGENT EXPLORIERT FREI</text><text x="490" y="215" font-size="24" font-weight="400">Separater Vibe-Chat</text><text x="490" y="251" font-size="24" font-weight="400">ohne PIV-Skills</text><rect x="900" y="145" width="340" height="132" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text x="920" y="175" font-size="16" font-weight="700">MENSCH BEURTEILT</text><text x="920" y="215" font-size="24" font-weight="400">Visuellen Entwurf</text><text x="920" y="251" font-size="24" font-weight="400">gemeinsam ausprobieren</text><path d="M380 211h85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><path d="M810 211h85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><rect x="900" y="365" width="340" height="132" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text x="920" y="395" font-size="16" font-weight="700">MENSCH + AGENT</text><text x="920" y="435" font-size="24" font-weight="400">Erkenntnisse und</text><text x="920" y="471" font-size="24" font-weight="400">Screenshots festhalten</text><rect x="470" y="365" width="340" height="132" rx="12" fill="#e5f4ec" stroke="#92aeb4"/><text x="490" y="395" font-size="16" font-weight="700">ANFORDERUNGEN SCHÄRFEN</text><text x="490" y="435" font-size="24" font-weight="400">PRD und Design Brief</text><text x="490" y="471" font-size="24" font-weight="400">gezielt überarbeiten</text><rect x="40" y="365" width="340" height="132" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text x="60" y="395" font-size="16" font-weight="700">SYSTEMATISCHER PIV</text><text x="60" y="435" font-size="24" font-weight="400">Mit getrennten Agents</text><text x="60" y="471" font-size="24" font-weight="400">neu implementieren</text><path d="M1070 277v82" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><path d="M900 430h-85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><path d="M470 430h-85" fill="none" stroke="#466774" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="570" width="1200" height="100" rx="12" fill="#fff0d9"/><text x="64" y="609" font-size="23" font-weight="400">Explorationscode wird niemals in die eigentliche Umsetzung übernommen.</text><text x="64" y="644" font-size="23" font-weight="400">Ein als Liefergegenstand gebauter Mock erfüllt weiterhin die gemeinsamen Verträge.</text></g></svg>